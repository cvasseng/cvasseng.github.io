<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MIDI Stem Splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0908;
    --ink: #f4f1ea;
    --ink-dim: #a8a298;
    --accent: #ff5b1f;
    --accent-dim: #6b2a13;
    --panel: #15130f;
    --line: #2a2620;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,91,31,0.08), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255,91,31,0.05), transparent 60%);
  }
  .grain {
    pointer-events: none;
    position: fixed; inset: 0;
    opacity: 0.05;
    z-index: 100;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  header {
    padding: 1.25rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 1.2rem;
    letter-spacing: -0.02em;
  }
  .brand .dot { color: var(--accent); }
  .meta {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-dim);
  }
  main {
    padding: 2.5rem 3rem 3rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: 3rem;
    align-items: center;
  }
  @media (max-width: 900px) {
    .hero {
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    main { padding: 1.5rem 1.5rem 2.5rem; }
    header { padding: 1rem 1.5rem; }
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(2.25rem, 4.5vw, 3.75rem);
    line-height: 0.98;
    letter-spacing: -0.04em;
    margin-bottom: 1rem;
  }
  h1 em {
    font-style: italic;
    font-weight: 900;
    color: var(--accent);
  }
  .lede {
    font-size: 0.9rem;
    color: var(--ink-dim);
    max-width: 42ch;
    line-height: 1.55;
  }

  .controls {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .control {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex: 1 1 18rem;
    min-width: 14rem;
  }
  .control-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
  }
  .select-wrap {
    position: relative;
  }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--accent);
    font-size: 0.85rem;
  }
  select#instrumentSelect {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 0.85rem 2.5rem 0.85rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select#instrumentSelect:hover,
  select#instrumentSelect:focus {
    outline: none;
    border-color: var(--accent);
  }
  select#instrumentSelect optgroup {
    background: var(--bg);
    color: var(--accent);
    font-family: 'Fraunces', serif;
    font-style: italic;
  }
  select#instrumentSelect option {
    background: var(--panel);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
  }

  .drop {
    display: block;
    border: 4px dashed var(--accent);
    background: var(--panel);
    padding: 2rem 1.5rem;
    text-align: center;
    transition: background 0.2s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    outline: none;
  }
  .drop:hover, .drop.over {
    background: #1a160f;
  }
  .drop:focus, .drop:focus-visible { outline: none; }
  .drop-icon {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 2.5rem;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 0.75rem;
  }
  .drop-text {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
  }
  .drop-text strong {
    color: var(--ink);
    font-weight: 500;
  }
  #fileInput { display: none; }
  .tracks {
    margin-top: 2rem;
    display: none;
  }
  .tracks.active { display: block; }
  .track {
    display: grid;
    grid-template-columns: 3rem 1fr auto;
    align-items: center;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--line);
    gap: 1.5rem;
    transition: background 0.2s;
  }
  .track:hover { background: var(--panel); }
  .track-num {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 1.5rem;
    color: var(--accent-dim);
  }
  .track-name {
    font-size: 0.95rem;
  }
  .track-meta {
    font-size: 0.75rem;
    color: var(--ink-dim);
    margin-top: 0.2rem;
  }
  .track-progress {
    width: 200px;
    height: 2px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  .track-progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
  }
  .track.done .track-progress-fill { width: 100% !important; }
  .track.done .track-num { color: var(--accent); }

  .download-fallback {
    margin-top: 2rem;
    padding: 1.25rem 1.5rem;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    background: var(--panel);
    display: none;
    font-size: 0.85rem;
    color: var(--ink-dim);
  }
  .download-fallback.show { display: block; }
  .download-fallback a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .download-fallback a:hover { color: var(--ink); }

  footer {
    padding: 1.25rem 3rem;
    border-top: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    display: flex;
    justify-content: space-between;
  }
  @media (max-width: 900px) {
    footer { padding: 1rem 1.5rem; }
  }
  .err {
    color: #ff7a52;
    margin-top: 1rem;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="grain"></div>

<header>
  <div class="brand">stems<span class="dot">.</span></div>
</header>

<main>
  <section class="hero">
    <div class="hero-text">
      <h1>Drop a MIDI.<br/>Get <em>stems</em>.</h1>
      <p class="lede">Each track renders to its own MP3, packaged in a zip. Nothing uploaded — everything runs locally in your browser.</p>
    </div>
    <div class="hero-action">
      <div class="controls">
        <div class="control">
          <span class="control-label">Instrument</span>
          <div class="select-wrap">
            <select id="instrumentSelect"></select>
          </div>
        </div>
      </div>
      <label for="fileInput" class="drop" id="drop">
        <div class="drop-icon">+</div>
        <div class="drop-text"><strong>Drop file</strong> or click to choose</div>
        <input type="file" id="fileInput" accept=".mid,.midi" />
      </label>
    </div>
  </section>

  <div class="tracks" id="tracks"></div>

  <div class="download-fallback" id="downloadFallback">
    Wait for the download to start, or <a id="downloadLink">click here</a> if it doesn't.
  </div>

  <div class="err" id="err"></div>
</main>

<footer>
  <span>no upload · no account · no nonsense</span>
  <span>v0.2</span>
</footer>

<!-- Surface load/runtime errors in the UI -->
<script>
  function _showBootErr(msg) {
    var el = document.getElementById('err');
    if (el) el.textContent = '⚠ ' + msg;
  }
  window.addEventListener('error', e => {
    _showBootErr((e.message || 'Script error') + (e.filename ? ' — ' + e.filename : ''));
  });
  window.addEventListener('unhandledrejection', e => {
    _showBootErr('Unhandled: ' + (e.reason && (e.reason.message || e.reason)));
  });
</script>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script type="module">
console.log('[stems] module loading…');
import { WorkletSynthesizer } from 'https://esm.sh/spessasynth_lib@4.2.15?deps=spessasynth_core@4.2.13';
import { BasicMIDI } from 'https://esm.sh/spessasynth_core@4.2.13';
console.log('[stems] spessasynth imported');

const SOUNDFONT_URL = 'https://cdn.jsdelivr.net/gh/spessasus/SpessaSynth@master/soundfonts/GeneralUserGS.sf3';
const WORKLET_URL = 'https://cdn.jsdelivr.net/npm/spessasynth_lib@4.2.15/dist/spessasynth_processor.min.js';

const GM_INSTRUMENTS = [

  ]],

  ]],
  ['Guitar', [

    'Electric Guitar (muted)','Overdriven Guitar','Distortion Guitar','Guitar Harmonics'
  ]],
  ['Bass', [

  ]],

  ]],

  ]],
  ['Brass', [

  ]],
  ['Synth Effects', [

  ]],
  ['Ethnic', [

  ]],
  ['Percussive', [
    'Tinkle Bell','Agogo','Steel Drums','Woodblock','Taiko Drum','Melodic Tom','Synth Drum','Reverse Cymbal'
  ]],
  ['Sound Effects', [
    'Guitar Fret Noise','Breath Noise','Seashore','Bird Tweet','Telephone Ring','Helicopter','Applause','Gunshot'
  ]],
];

const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const tracksEl = document.getElementById('tracks');
const errEl = document.getElementById('err');
const instrumentSelect = document.getElementById('instrumentSelect');
const downloadFallback = document.getElementById('downloadFallback');
const downloadLink = document.getElementById('downloadLink');

(function buildInstrumentSelect() {
  const def = document.createElement('option');
  def.value = '';
  def.textContent = 'Use from file';
  instrumentSelect.appendChild(def);
  let n = 0;
  for (const [group, names] of GM_INSTRUMENTS) {
    const og = document.createElement('optgroup');
    og.label = group;
    for (const name of names) {
      const o = document.createElement('option');
      o.value = String(n);
      o.textContent = name;
      og.appendChild(o);
      n++;
    }
    instrumentSelect.appendChild(og);
  }
})();

let soundfontBuffer = null;
let lastDownloadURL = null;

function setStatus(msg) { console.log('[stems]', msg); }
function showErr(e) {
  console.error(e);
  errEl.textContent = '⚠ ' + (e.message || e);
}

['dragenter', 'dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); })
);
['dragleave', 'drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); })
);
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) handleFile(f);
});

console.log('[stems] ready');

async function loadSoundfont() {
  if (soundfontBuffer) return soundfontBuffer;
  setStatus('Loading soundfont…');
  const resp = await fetch(SOUNDFONT_URL);
  if (!resp.ok) throw new Error(`Soundfont fetch failed (HTTP ${resp.status})`);
  const total = Number(resp.headers.get('content-length')) || 0;
  if (!resp.body || !total) {
    soundfontBuffer = await resp.arrayBuffer();
    return soundfontBuffer;
  }
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    setStatus(`Loading soundfont… ${(received / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`);
  }
  const merged = new Uint8Array(received);
  let offset = 0;
  for (const c of chunks) { merged.set(c, offset); offset += c.length; }
  soundfontBuffer = merged.buffer;
  return soundfontBuffer;
}

function encodeMP3(audioBuffer, bitrate = 128) {
  const channels = Math.min(audioBuffer.numberOfChannels, 2);
  const sampleRate = audioBuffer.sampleRate;
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, bitrate);
  const samplesL = audioBuffer.getChannelData(0);
  const samplesR = channels === 2 ? audioBuffer.getChannelData(1) : null;
  const toInt16 = (f32) => {
    const out = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      let s = Math.max(-1, Math.min(1, f32[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return out;
  };
  const left = toInt16(samplesL);
  const right = samplesR ? toInt16(samplesR) : null;
  const blockSize = 1152;
  const mp3Data = [];
  for (let i = 0; i < left.length; i += blockSize) {
    const l = left.subarray(i, i + blockSize);
    const r = right ? right.subarray(i, i + blockSize) : null;
    const buf = channels === 2 ? mp3encoder.encodeBuffer(l, r) : mp3encoder.encodeBuffer(l);
    if (buf.length > 0) mp3Data.push(buf);
  }
  const flush = mp3encoder.flush();
  if (flush.length > 0) mp3Data.push(flush);
  return new Blob(mp3Data, { type: 'audio/mp3' });
}

// Build a single-track MIDI file from one track of the parsed source.
// If instrumentOverride is a number (0-127), force every track onto a
// non-drum channel with that program — used for "play everything as piano"
// style choir practice stems.
function buildSingleTrackMidi(srcMidi, trackIndex, instrumentOverride) {
  const Midi = window['@tonejs/midi'] ? window['@tonejs/midi'].Midi : window.Midi;
  const out = new Midi();
  out.header = srcMidi.header;
  const track = srcMidi.tracks[trackIndex];
  const newTrack = out.addTrack();
  const overriding = Number.isInteger(instrumentOverride);
  newTrack.channel = overriding ? 0 : track.channel;
  newTrack.instrument.number = overriding ? instrumentOverride : track.instrument.number;
  newTrack.name = track.name;
  track.notes.forEach(n => newTrack.addNote({
    midi: n.midi, time: n.time, duration: n.duration, velocity: n.velocity
  }));
  if (!overriding && track.controlChanges) {
    Object.values(track.controlChanges).flat().forEach(cc =>
      newTrack.addCC({ number: cc.number, value: cc.value, time: cc.time })
    );
  }
  if (!overriding && track.pitchBends) {
    track.pitchBends.forEach(pb => newTrack.addPitchBend ? newTrack.addPitchBend({ value: pb.value, time: pb.time }) : null);
  }
  return out.toArray();
}

async function renderTrackToBuffer(midiBytes, sampleRate, onProgress) {
  const parsedMIDI = BasicMIDI.fromArrayBuffer(midiBytes.buffer.slice(
    midiBytes.byteOffset, midiBytes.byteOffset + midiBytes.byteLength
  ));
  // Pad by 1s so reverb tails don't get clipped.
  const length = Math.ceil((parsedMIDI.duration + 1) * sampleRate);
  const ctx = new OfflineAudioContext({
    numberOfChannels: 2,
    sampleRate,
    length
  });
  await ctx.audioWorklet.addModule(WORKLET_URL);
  const synth = new WorkletSynthesizer(ctx, { enableEventSystem: false });
  synth.connect(ctx.destination);

  // IMPORTANT: per spessasynth_lib docs, call startOfflineRender immediately
  // after construction and BEFORE any other method. Chromium drops worklet
  // messages on OfflineAudioContext, which is why the previous Sequencer-
  // based approach produced silent renders in Chrome/WebKit.
  await synth.startOfflineRender({
    soundBankList: [{ bankOffset: 0, soundBankBuffer: soundfontBuffer.slice(0) }],
    midiSequence: parsedMIDI,
    loopCount: 0,
    sequencerOptions: { skipToFirstNoteOn: true }
  });
  await synth.isReady;

  let cancelled = false;
  const renderPromise = ctx.startRendering();
  (function tick() {
    if (cancelled) return;
    if (onProgress) onProgress(Math.min(1, ctx.currentTime / (parsedMIDI.duration + 1)));
    setTimeout(tick, 100);
  })();
  const rendered = await renderPromise;
  cancelled = true;
  if (onProgress) onProgress(1);
  try { synth.destroy(); } catch (_) {}
  return rendered;
}

async function handleFile(file) {
  errEl.textContent = '';
  tracksEl.innerHTML = '';
  tracksEl.classList.remove('active');
  downloadFallback.classList.remove('show');
  if (lastDownloadURL) { URL.revokeObjectURL(lastDownloadURL); lastDownloadURL = null; }

  try {
    setStatus(`Parsing ${file.name}…`);
    const buf = await file.arrayBuffer();
    const Midi = window['@tonejs/midi'] ? window['@tonejs/midi'].Midi : window.Midi;
    const midi = new Midi(buf);
    const tracksWithNotes = midi.tracks
      .map((t, i) => ({ track: t, originalIndex: i }))
      .filter(({ track }) => track.notes && track.notes.length > 0);

    if (tracksWithNotes.length === 0) throw new Error('No playable tracks found in MIDI.');

    setStatus(`Found ${tracksWithNotes.length} tracks. Loading soundfont…`);
    await loadSoundfont();

    const instrumentOverrideRaw = instrumentSelect.value;
    const instrumentOverride = instrumentOverrideRaw === '' ? null : parseInt(instrumentOverrideRaw, 10);

    tracksEl.classList.add('active');
    tracksWithNotes.forEach(({ track, originalIndex }, displayIdx) => {
      const isDrum = track.channel === 9;
      const programLabel = (instrumentOverride !== null)
        ? `→ prog ${instrumentOverride}`
        : `prog ${track.instrument.number}${isDrum ? ' (drums)' : ''}`;
      const row = document.createElement('div');
      row.className = 'track';
      row.id = `track-${originalIndex}`;
      row.innerHTML = `
        <div class="track-num">${String(displayIdx + 1).padStart(2, '0')}</div>
        <div>
          <div class="track-name">${escapeHtml(track.name || `Track ${originalIndex + 1}`)}</div>
          <div class="track-meta">${track.notes.length} notes · ch ${track.channel} · ${programLabel}</div>
        </div>
        <div class="track-progress"><div class="track-progress-fill"></div></div>
      `;
      tracksEl.appendChild(row);
    });

    const zip = new JSZip();
    const baseName = file.name.replace(/\.midi?$/i, '');
    const sampleRate = 44100;
    const total = tracksWithNotes.length;

    // Serial rendering. Concurrent OfflineAudioContexts share the audio
    // thread and contend for it — sequential is faster in practice and
    // also keeps memory low (each context holds duration*sr*8 bytes).
    for (let i = 0; i < total; i++) {
      const { track, originalIndex } = tracksWithNotes[i];
      const row = document.getElementById(`track-${originalIndex}`);
      const fill = row.querySelector('.track-progress-fill');
      fill.style.width = '5%';

      const singleMidi = buildSingleTrackMidi(midi, originalIndex, instrumentOverride);
      setStatus(`Rendering ${i + 1}/${total}…`);
      const audioBuf = await renderTrackToBuffer(singleMidi, sampleRate, p => {
        fill.style.width = (5 + p * 80) + '%';
      });
      fill.style.width = '90%';

      const mp3Blob = encodeMP3(audioBuf, 128);
      const rawName = (track.name || `untitled`).replace(/[^a-z0-9_-]+/gi, '_').replace(/^_+|_+$/g, '') || 'untitled';
      const fileName = `${rawName}_track${i + 1}.mp3`;
      zip.file(fileName, mp3Blob);

      fill.style.width = '100%';
      row.classList.add('done');
    }

    setStatus('Packaging zip…');
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    lastDownloadURL = url;

    const downloadName = `${baseName}_stems.zip`;
    const a = document.createElement('a');
    a.href = url;
    a.download = downloadName;
    document.body.appendChild(a);
    a.click();
    a.remove();

    downloadLink.href = url;
    downloadLink.download = downloadName;
    downloadFallback.classList.add('show');

    setStatus(`Done. ${tracksWithNotes.length} stems exported.`);
  } catch (e) {
    showErr(e);
    setStatus('Failed.');
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
